services:
  mysql:
    image: mysql:8.4
    container_name: prayerkids_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: prayerkids_hr
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: prayerkids_backend
    working_dir: /var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:18080
      FRONTEND_URL: http://localhost:15173
      CORS_ALLOWED_ORIGINS: http://localhost:15173,http://127.0.0.1:15173
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: prayerkids_hr
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "18080:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: prayerkids_frontend
    working_dir: /app
    environment:
      VITE_DEV_PROXY_TARGET: http://backend:8000
    ports:
      - "15173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
